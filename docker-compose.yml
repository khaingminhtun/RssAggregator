
services:
  db:
    image: postgres:15
    container_name: ${DB_CONTAINER}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
       - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: my_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db

  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    

  rssagg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rssagg_app
    restart: always
    ports:
      - "${APP_PORT}:3000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db           # hostname of the Postgres container
      POSTGRES_PORT: ${DB_PORT}   # usually 5432
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis           # hostname of Redis container
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - db
      - redis
    volumes:
      - ./env/.env:/app/.env:ro   # <-- read-only .env inside container

volumes:
  pgdata:
  redisdata:


  


