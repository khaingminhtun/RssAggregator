version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./internal/adapters/database/sqlc"
    schema: "./internal/adapters/database/migrations"
    gen:
      go:
        package: "repo"
        out: "./internal/adapters/database/repo"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true

        overrides:
          # NON-NULL text → string
          - db_type: "text"
            nullable: false
            go_type: "string"

          # NULLABLE text → sql.NullString
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"

          # timestamptz (already correct)
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
